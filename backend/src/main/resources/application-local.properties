# ============================================================
# ERP Portal — LOCAL Environment Configuration
# ============================================================

server.port=8080

# DataSource — Local MySQL Instance or Docker Compose
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/erp_portal_db?serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Schema Migration & Validation
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.validate-on-migrate=true

# Security & CORS
security.session.ttl-seconds=${AUTH_SESSION_TTL_SECONDS:1800}
security.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# Actuator & Probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.erp.portal=INFO
