# ============================================================
# ERP Portal — PRODUCTION Environment Configuration
# ============================================================

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.forward-headers-strategy=native

# DataSource — Production Database Cluster (Aurora / Cloud SQL / Multi-AZ RDS)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP Production Sizing)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ErpProductionHikariPool

# JPA / Hibernate — Strict Validation (No DDL Generation or Alteration)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.open-in-view=false

# Flyway — Production Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# Security & CORS (Production Hostnames Required)
security.session.ttl-seconds=${AUTH_SESSION_TTL_SECONDS:1800}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Storage
student.documents.storage-dir=${STUDENT_DOCUMENT_STORAGE_DIR:/var/erp/storage/student-documents}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

# Swagger / OpenAPI (Disabled by default in production; toggle via environment)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Production Logging (No DEBUG, Structured Console Output with Correlation IDs)
logging.level.root=INFO
logging.level.com.erp.portal=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n
