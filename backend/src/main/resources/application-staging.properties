# ============================================================
# ERP Portal — STAGING Environment Configuration
# ============================================================

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# DataSource — Managed MySQL in Staging (RDS / Cloud SQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ErpStagingHikariPool

# JPA / Hibernate — Strict Validation (No DDL Generation)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.open-in-view=false

# Flyway — Automatic Forward Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# Security & CORS
security.session.ttl-seconds=${AUTH_SESSION_TTL_SECONDS:1800}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://staging.erp.internal}

# Storage
student.documents.storage-dir=${STUDENT_DOCUMENT_STORAGE_DIR:/var/erp/storage/student-documents}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.erp.portal=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n
