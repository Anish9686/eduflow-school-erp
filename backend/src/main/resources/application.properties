# ============================================================
# ERP Portal — Application Configuration
# ============================================================

spring.application.name=erp-portal

# ============================================================
# Server
# ============================================================
server.port=8080
server.servlet.context-path=/

# ============================================================
# DataSource — MySQL 8
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/erp_portal_db?serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.locations=classpath:db/migration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# Actuator & Observability Probes
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ErpHikariPool

# ============================================================
# JPA / Hibernate
# REQ-ARCH-003: Schema changes are migration-controlled — validate only
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.open-in-view=false

# ============================================================
# Flyway — REQ-ARCH-003
# ============================================================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# Opaque bearer session lifetime (30 minutes, enforced server-side)
security.session.ttl-seconds=${AUTH_SESSION_TTL_SECONDS:1800}

# Student document uploads (local storage path may be overridden in deployment).
student.documents.storage-dir=${STUDENT_DOCUMENT_STORAGE_DIR:./storage/student-documents}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ============================================================
# OpenAPI / Swagger — REQ-ARCH-005
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ============================================================
# Logging — NFR-OBS-001 (no passwords, no tokens in logs)
# ============================================================
logging.level.root=INFO
logging.level.com.erp.portal=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n
