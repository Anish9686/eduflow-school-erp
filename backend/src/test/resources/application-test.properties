# ============================================================
# ERP Portal — Test Profile (H2 in-memory)
# ============================================================

spring.datasource.url=jdbc:h2:mem:erp_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:auth-test-schema.sql
security.session.ttl-seconds=60

logging.level.root=WARN
logging.level.com.erp.portal=INFO

