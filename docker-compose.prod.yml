services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${ERP_BACKEND_IMAGE:-erp-backend:latest}
    container_name: erp-backend-prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-1800}
      STUDENT_DOCUMENT_STORAGE_DIR: /var/erp/storage/student-documents
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    volumes:
      - student_docs:/var/erp/storage/student-documents
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - erp-prod-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${ERP_FRONTEND_IMAGE:-erp-frontend:latest}
    container_name: erp-frontend-prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - erp-prod-net

volumes:
  student_docs:
    name: erp_prod_student_docs

networks:
  erp-prod-net:
    name: erp_production_network
    driver: bridge
